# HTTP : uniquement une redirection vers HTTPS
<VirtualHost *:80>
    ServerName webmail.lab.test
    Redirect permanent / https://webmail.lab.test/
</VirtualHost>

# HTTPS : le webmail
<VirtualHost *:443>
    ServerName webmail.lab.test
    DocumentRoot /var/lib/roundcube/public_html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/mail.lab.test.fullchain.pem
    SSLCertificateKeyFile /etc/ssl/private/mail.lab.test.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"

    <Directory /var/lib/roundcube/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/webmail_error.log
    CustomLog ${APACHE_LOG_DIR}/webmail_access.log combined
</VirtualHost>
